<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070b" />
    </linearGradient>
    <linearGradient id="key-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="key-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- 3D Keycap Base -->
  <path d="M96 156 L416 156 L440 400 L72 400 Z" fill="#090d16" stroke="url(#key-border)" stroke-width="6" />

  <!-- 3D Keycap Top Surface -->
  <rect x="116" y="140" width="280" height="200" rx="36" fill="url(#key-top)" stroke="url(#key-border)" stroke-width="4" />

  <!-- Inner Keycap Dish Inset -->
  <rect x="136" y="156" width="240" height="160" rx="26" fill="#0c1220" />

  <!-- Central Hero Key 'K' with Lightning Bolt -->
  <g filter="url(#glow)">
    <!-- Letter K Left Stem -->
    <rect x="190" y="180" width="26" height="110" rx="8" fill="#38bdf8" />
    
    <!-- Lightning Bolt / Dynamic Slash -->
    <polygon points="266,180 326,180 240,245 290,245 206,300 236,242 206,242" fill="url(#lightning)" />
  </g>

  <!-- Tactile Home Row Anchor Nub (J/F Key identifier) -->
  <rect x="236" y="278" width="40" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
</svg>